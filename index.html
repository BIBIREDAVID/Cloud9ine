<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Cloud9ine</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet"/>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: 'Inter', sans-serif;
      background: linear-gradient(to bottom, #eaf6fb, #d6eaf8);
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      padding-top: 50px;
    }

    .container {
      background: white;
      padding: 20px 25px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
      width: 100%;
      max-width: 400px;
    }

    .header {
      text-align: center;
      font-size: 1.8rem;
      font-weight: 600;
      margin-bottom: 20px;
    }

    .search-group {
      display: flex;
      gap: 10px;
      margin-bottom: 15px;
    }

    input[type="text"] {
      flex: 1;
      padding: 10px 12px;
      border: 1px solid #ccc;
      border-radius: 10px;
      font-size: 14px;
    }

    button {
      padding: 10px 14px;
      background-color: #0079d3;
      color: #fff;
      border: none;
      border-radius: 10px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.2s ease;
    }

    button:hover {
      background-color: #005fa3;
    }

    .weather-card {
      background: #f9fbfd;
      border-radius: 16px;
      padding: 20px;
      text-align: center;
    }

    .weather-card h3 {
      margin: 0 0 10px;
      font-size: 1.2rem;
    }

    .weather-card img {
      width: 60px;
    }

    .weather-details {
      display: flex;
      justify-content: space-around;
      margin-top: 15px;
      font-size: 0.9rem;
    }

    .detail-item {
      text-align: center;
    }

    .detail-item span {
      display: block;
      margin-top: 4px;
      font-weight: bold;
    }

    .loading {
      text-align: center;
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">Cloud9ine</div>
    <form id="location-form">
      <div class="search-group">
        <input list="location-suggestions" type="text" id="location-input" placeholder="Enter location..." required />
        <datalist id="location-suggestions"></datalist>
      </div>
      <div class="search-group">
        <button type="submit">Search</button>
        <button type="button" id="current-location-btn">Use Current Location📍</button>
      </div>
    </form>
    <div id="weather-container"></div>
  </div>

  <script>
    const weatherContainer = document.getElementById('weather-container');
    const locationForm = document.getElementById('location-form');
    const locationInput = document.getElementById('location-input');
    const locationSuggestions = document.getElementById('location-suggestions');
    const currentLocationBtn = document.getElementById('current-location-btn');
    const apiKey = '65ead67f1d1049cf7125dd9939bf742a';

    async function fetchLocationSuggestions(query) {
      try {
        const response = await fetch(`https://api.openweathermap.org/geo/1.0/direct?q=${query}&limit=5&appid=${apiKey}`);
        const data = await response.json();
        locationSuggestions.innerHTML = '';
        data.forEach(place => {
          const option = document.createElement('option');
          option.value = `${place.name}, ${place.country}`;
          locationSuggestions.appendChild(option);
        });
      } catch (error) {
        console.error(error.message);
      }
    }

    locationInput.addEventListener('input', () => {
      const query = locationInput.value.trim();
      if (query.length > 2) {
        fetchLocationSuggestions(query);
      }
    });

    async function fetchWeather(location) {
      try {
        const response = await fetch(
          `https://api.openweathermap.org/data/2.5/weather?q=${location}&units=metric&appid=${apiKey}`
        );
        const data = await response.json();
        return data;
      } catch (error) {
        console.error(error.message);
        return null;
      }
    }

    function displayWeather(data) {
      if (!data || data.cod !== 200) {
        weatherContainer.innerHTML = '<p style="color: red;">Error fetching weather. Please try again.</p>';
        return;
      }

      const { name, sys, main, wind, weather } = data;
      const icon = `https://openweathermap.org/img/wn/${weather[0].icon}@2x.png`;

      weatherContainer.innerHTML = `
        <div class="weather-card">
          <h3>${name}, ${sys.country}</h3>
          <img src="${icon}" alt="${weather[0].description}" />
          <p>${weather[0].main} • ${main.temp.toFixed(1)}°C</p>
          <div class="weather-details">
            <div class="detail-item">💧 Humidity<span>${main.humidity}%</span></div>
            <div class="detail-item">🌬️ Wind<span>${wind.speed} km/h</span></div>
            <div class="detail-item">🔆 Feels Like<span>${main.feels_like.toFixed(1)}°C</span></div>
          </div>
        </div>
      `;
    }

    locationForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const location = locationInput.value.trim();
      weatherContainer.innerHTML = '<p class="loading">Loading...</p>';
      const weatherData = await fetchWeather(location);
      displayWeather(weatherData);
    });

    currentLocationBtn.addEventListener('click', () => {
      if ('geolocation' in navigator) {
        navigator.geolocation.getCurrentPosition(async (position) => {
          const { latitude, longitude } = position.coords;
          const response = await fetch(`https://api.openweathermap.org/data/2.5/weather?lat=${latitude}&lon=${longitude}&units=metric&appid=${apiKey}`);
          const data = await response.json();
          displayWeather(data);
        }, () => {
          weatherContainer.innerHTML = '<p style="color: red;">Unable to fetch location.</p>';
        });
      } else {
        weatherContainer.innerHTML = '<p style="color: red;">Geolocation not supported.</p>';
      }
    });
  </script>
</body>
</html>
